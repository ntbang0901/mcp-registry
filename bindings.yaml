# yaml-language-server: $schema=./schemas/bindings.schema.json
#
# Which repositories use which shared MCP servers. Keys are repository ids (host/owner/name);
# any git remote URL also works. Two forms:
#
#   github.com/acme/app: [linkup, context7]                       # list
#   github.com/acme/api:                                          # map, with per-repository params
#     postgres: { params: { database: app_db, password: env://APP_DB_PASSWORD } }
#     linkup:
#
# Usually edited for you by `loadout ui`, `loadout import`, `loadout attach` and `loadout set`.
repositories: {}
